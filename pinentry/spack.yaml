# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
#
# This manifest is for installing pinentry, a small collection of dialog programs that allow GnuPG to read passphrases and PIN numbers in a secure manner.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [pinentry]
  - _version: [1.3.0-1]
  # _spack-version informs the branch of spack to use
  - _spack-version: ["1.1"]
  # Release database provenance information - packages for inclusion into the database (not relevant/required), and packages just for injection into the modules
  - _provenance: []
  - _injection: []
  specs:
  - pinentry@1.3.0 gui=tty
  packages:
    # Compilers
    c:
      require:
      - 'gcc@15.1.0'
    cxx:
      require:
      - 'gcc@15.1.0'
    fortran:
      require:
      - 'gcc@15.1.0'
    all:
      prefer:
      - 'target=x86_64_v3'
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.02.002
      destination: $env/package-repos/access-spack-packages
  modules:
    default:
      tcl:
        include:
        - pinentry
        projections:
          # build-cd will inject the _version into this projection
          pinentry: 'system-tools/{name}/{version}'
