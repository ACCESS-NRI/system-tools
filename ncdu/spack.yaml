# This is a Spack Environment file
#
# It describes a set of packages to be installed, along with
# configuration settings.
#
# This manifest is for installing ncdu, a terminal user interface for du (disk usage)
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [ncdu]
  - _version: ['1.19-1']
  # _spack-version informs the branch of spack to use
  - _spack-version: ["1.1"]
  # Release database provenance information - packages for inclusion into the database, and packages just for injection into the modules
  - _provenance: []
  - _injection: []
  specs:
  - ncdu@1.19
  packages:
    # Compilers
    c:
      require:
      - 'gcc@15.1.0'
    cxx:
      require:
      - 'gcc@15.1.0'
    fortran:
      require:
      - 'gcc@15.1.0'
    all:
      prefer:
      - 'target=x86_64_v3'
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.02.002
      destination: $env/.package_repos/access-spack-packages
  modules:
    default:
      tcl:
        include:
        - ncdu
        projections:
          # build-cd will inject the _version into this projection
          ncdu: 'system-tools/{name}/{version}'
